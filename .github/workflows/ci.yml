name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-ci.yml@main
    with:
      solution: Hexalith.Conversations.slnx
      build-timeout-minutes: 30
      test-platform: microsoft-testing-platform
      run-consumer-validation: true
      unit-test-projects: |
        tests/Hexalith.Conversations.Contracts.Tests
        tests/Hexalith.Conversations.Client.Tests
        tests/Hexalith.Conversations.Tests
        tests/Hexalith.Conversations.Server.Tests
        tests/Hexalith.Conversations.TestSupport.Tests
      integration-test-projects: |
        tests/Hexalith.Conversations.IntegrationTests
      aspire-test-project: tests/Hexalith.Conversations.AppHost.Tests
      aspire-continue-on-error: false
      aspire-timeout-minutes: 20

  minimal-module-compatibility:
    name: ci / minimal-module platform compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Initialize only the pinned root platform and build dependencies
        run: git submodule update --init -- references/Hexalith.Builds references/Hexalith.EventStore

      - name: Initialize .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Python for result validation
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Test missing and unsuccessful result detection
        run: python3 -m unittest discover -s tests/tooling -p 'test_minimal_module_compatibility_results.py'

      - name: Locked restore and build the platform-backed fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults/minimal-module
          fixture="tests/fixtures/Hexalith.Conversations.MinimalModule/Hexalith.Conversations.MinimalModule.slnx"
          compatibility="$PWD/tests/compatibility/MinimalModule/RegisteredCommand.targets"
          dotnet restore "$fixture" --locked-mode -p:Configuration=Release \
            "-p:CustomAfterMicrosoftCommonTargets=$compatibility" \
            2>&1 | tee TestResults/minimal-module/restore.log
          dotnet build "$fixture" --configuration Release --no-restore \
            "-p:CustomAfterMicrosoftCommonTargets=$compatibility" \
            2>&1 | tee TestResults/minimal-module/build.log

      - name: Run all six fixture tests and the registered-command assertion without skips
        shell: bash
        run: |
          set -euo pipefail
          dotnet tests/fixtures/Hexalith.Conversations.MinimalModule/tests/Hexalith.Conversations.MinimalModule.Tests/bin/Release/net10.0/Hexalith.Conversations.MinimalModule.Tests.dll \
            -automated sync -failSkips -result-xml "$PWD/TestResults/minimal-module/results.xml" \
            2>&1 | tee TestResults/minimal-module/tests.log
          python3 tests/compatibility/MinimalModule/verify_results.py TestResults/minimal-module/results.xml \
            2>&1 | tee TestResults/minimal-module/verification.log

      - name: Upload platform compatibility results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: minimal-module-platform-compatibility
          path: TestResults/minimal-module/*
          retention-days: 7

  testsupport-windows:
    name: ci / TestSupport Windows descendant cleanup
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Initialize root-declared build dependency
        run: |
          git config --global core.longpaths true
          git submodule update --init -- references/Hexalith.Builds

      - name: Initialize .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Python for the process fixture
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Build TestSupport tests
        run: dotnet build tests/Hexalith.Conversations.TestSupport.Tests/Hexalith.Conversations.TestSupport.Tests.csproj --configuration Release

      - name: Check TestSupport project pack and publish properties
        shell: pwsh
        run: |
          $projects = @(
            'tests/Hexalith.Conversations.TestSupport/Hexalith.Conversations.TestSupport.csproj',
            'tests/Hexalith.Conversations.TestSupport.Tests/Hexalith.Conversations.TestSupport.Tests.csproj'
          )
          foreach ($project in $projects) {
            foreach ($configuration in @('Debug', 'Release')) {
              $evaluation = dotnet msbuild $project "-p:Configuration=$configuration" '-getProperty:IsPackable,IsPublishable' -nologo | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or $evaluation.Properties.IsPackable -ne 'false' -or $evaluation.Properties.IsPublishable -ne 'false') {
                throw "$project ($configuration) must have IsPackable=false and IsPublishable=false"
              }
            }
          }

      - name: Run TestSupport tests on Windows
        run: >-
          dotnet tests/Hexalith.Conversations.TestSupport.Tests/bin/Release/net10.0/Hexalith.Conversations.TestSupport.Tests.dll
          -automated sync -failSkips

  repository:
    name: ci / repository
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # The story-record tests read closed records from earlier commits.
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Check root submodule declarations and gitlinks
        run: python3 scripts/check-root-submodules.py --repository .

      - name: Test root submodule check
        run: python3 -m unittest discover -s tests/tooling -p 'test_check_root_submodules.py'

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install locked Python tooling
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.23
          uv sync --locked --python 3.11

      # Fails when a governed route loses or misplaces its STORY-COMPLETION-GATE block,
      # or when a block drifts from the other surfaces or drops a required clause.
      - name: Verify story completion gate surfaces
        shell: bash
        run: |
          set -euo pipefail
          for scenario in AC-7.3-01 AC-7.3-02; do
            uv run --frozen --no-sync python3 _bmad/scripts/verify_story_completion_workflows.py \
              --repository . \
              --contract _bmad-output/planning-artifacts/v9/story-contracts/7.3.json \
              --scenario "$scenario" \
              --output "artifacts/v9/7.3/$scenario.json"
          done

      # The Epic 6 supersession suite reads gitlink commit objects, which need
      # initialized submodules; it stays in the local lane only.
      - name: Initialize .NET for the package-free evidence bridge
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Test BMAD repository tooling
        run: >-
          uv run --frozen --no-sync python3 -m pytest -q -ra -p no:cacheprovider
          _bmad/scripts/tests tests/tooling/test_evidence_boundary_current.py
          --ignore=_bmad/scripts/tests/test_verify_epic_6_completion_supersession.py
          --junitxml=TestResults/bmad-scripts/bmad-scripts.xml

      - name: Upload repository tooling evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: repository-tooling-results
          path: |
            TestResults/bmad-scripts/*.xml
            artifacts/v9/7.3/*.json
          retention-days: 7

  admin-web:
    name: ci / admin-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Initialize root-declared submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Build tests and install Playwright Chromium
        shell: pwsh
        run: ./tests/install-playwright.ps1 -Configuration Release

      - name: Run Admin Web tests
        run: >-
          dotnet test
          tests/Hexalith.Conversations.Admin.Web.Tests/Hexalith.Conversations.Admin.Web.Tests.csproj
          --configuration Release
          --no-build
          --results-directory TestResults/admin-web
          --report-xunit-trx
          --report-xunit-trx-filename admin-web.trx

      - name: Upload Admin Web test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: admin-web-test-results
          path: TestResults/admin-web/*.trx
          retention-days: 7

  conformance:
    name: ci / conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete source history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Initialize root-declared submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Python for live tier controls
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install locked tier verification tooling
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.23
          uv sync --locked --python 3.11

      - name: Build portable conformance project
        run: >-
          dotnet build
          tests/Hexalith.Conversations.Conformance.Portable.Tests/Hexalith.Conversations.Conformance.Portable.Tests.csproj
          --configuration Release
          -warnaserror

      - name: Build conformance project
        run: >-
          dotnet build
          tests/Hexalith.Conversations.Conformance.Tests/Hexalith.Conversations.Conformance.Tests.csproj
          --configuration Release
          -warnaserror

      - name: Run current conformance checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults/conformance
          portable="tests/Hexalith.Conversations.Conformance.Portable.Tests/bin/Release/net10.0/Hexalith.Conversations.Conformance.Portable.Tests.dll"
          internal="tests/Hexalith.Conversations.Conformance.Tests/bin/Release/net10.0/Hexalith.Conversations.Conformance.Tests.dll"
          # Retain historical exclusions and all frozen definitions. Each tier's
          # ConformanceOracleTieringValidationTest compares the live tree with a story
          # freeze (Story 9.1 in the portable tier, Story 9.2 AC-04/AC-05 in the internal
          # tier), so routine CI excludes both. The Story 9.2 tier verifier and fault
          # fixtures retired from CI with them; run them by name to reproduce acceptance.
          # The portable compile-surface control (AC-02) stays a live guard.
          uv run --frozen --no-sync dotnet "$portable" -failSkips \
            -class- "Hexalith.Conversations.Conformance.Tests.ArchitecturePlanningAuthorityValidationTest" \
            -class- "Hexalith.Conversations.Conformance.Tests.PlanningAuthorityV8ValidationTest" \
            -class- "Hexalith.Conversations.Conformance.Tests.PlanningAuthorityV9ValidationTest" \
            -class- "Hexalith.Conversations.Conformance.Tests.PlanningToolingEnvironmentAuthorityV15ValidationTest" \
            -class- "Hexalith.Conversations.Conformance.Tests.PlanningToolingLifecycleAuthorityV16ValidationTest" \
            -class- "Hexalith.Conversations.Conformance.Tests.PackageEnvironmentAuthorityV18ValidationTest" \
            -class- "Hexalith.Conversations.Conformance.Tests.StoryFinalRecordGenerationValidationTest" \
            -class- "Hexalith.Conversations.Conformance.Tests.ConformanceOracleTieringValidationTest" \
            -method- "Hexalith.Conversations.Conformance.Tests.PreservationTraceabilityManifestValidationTest.BindingsClosuresAndFrozenV1BytesShouldValidateIndependently" \
            -method- "Hexalith.Conversations.Conformance.Tests.PreservationTraceabilityManifestValidationTest.CurrentControlsAndTierPrerequisiteShouldStayTruthful" \
            -method- "Hexalith.Conversations.Conformance.Tests.PreservationTraceabilityManifestValidationTest.PublicSurfacesAndConformanceAssertionsShouldHaveZeroGap" \
            -method- "Hexalith.Conversations.Conformance.Tests.SmC2BaselineReconstructionValidationTest.BaselineShouldRecordAnAuditableReconstructionMethod" \
            -parallelMode none \
            -result-trx TestResults/conformance/portable.trx \
            -noLogo
          # The five adoption ACs replay the full frozen 10.4 boundary at HEAD.
          # Keep explicit historical invocation. The repository lane runs reader faults on
          # frozen 10.4 reader bytes; live reader bytes are checked only by naming this class.
          # Reproduction and mutation proof: docs/runbooks/epic-10-fault-regressions.md.
          uv run --frozen --no-sync dotnet "$internal" -failSkips \
            -class- "Hexalith.Conversations.Conformance.Tests.ConformanceOracleTieringValidationTest" \
            -class- "Hexalith.Conversations.Conformance.Tests.EvidenceBoundaryAdoptionValidationTest" \
            -parallelMode none \
            -result-trx TestResults/conformance/internal.trx \
            -noLogo

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: conformance-test-results
          path: TestResults/conformance/*
          retention-days: 7

  tooling:
    name: ci / release-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize root-declared submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Set up supported Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Initialize .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Python for tooling discovery
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install locked Python tooling
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.23
          uv sync --locked --python 3.11

      - name: Install locked release tooling
        run: npm ci --ignore-scripts

      - name: Verify npm dependency provenance and signatures
        run: npm audit signatures

      - name: Enforce pinned commit and pull-request title policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            npx --no-install commitlint --config commitlint.config.mjs --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
            npx --no-install commitlint --config commitlint.config.mjs --verbose <<< "$PR_TITLE"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            while IFS= read -r commit; do
              git show --no-patch --format=%B "$commit" |
                npx --no-install commitlint --config commitlint.config.mjs --verbose
            done < <(git rev-list --reverse "$HEAD_SHA")
          else
            npx --no-install commitlint --config commitlint.config.mjs --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          fi

      - name: Run fail-closed tooling tests
        # unittest imports pytest modules; their function tests run in the repository job.
        run: uv run --frozen --no-sync npm test
