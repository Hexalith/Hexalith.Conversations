name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-ci.yml@main
    with:
      solution: Hexalith.Conversations.slnx
      build-timeout-minutes: 30
      test-platform: microsoft-testing-platform
      run-consumer-validation: true
      unit-test-projects: |
        tests/Hexalith.Conversations.Contracts.Tests
        tests/Hexalith.Conversations.Client.Tests
        tests/Hexalith.Conversations.Tests
        tests/Hexalith.Conversations.Server.Tests
      integration-test-projects: |
        tests/Hexalith.Conversations.IntegrationTests
      aspire-test-project: tests/Hexalith.Conversations.AppHost.Tests
      aspire-continue-on-error: false
      aspire-timeout-minutes: 20

  admin-web:
    name: ci / admin-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Initialize root-declared submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Build tests and install Playwright Chromium
        shell: pwsh
        run: ./tests/install-playwright.ps1 -Configuration Release

      - name: Run Admin Web tests
        run: >-
          dotnet test
          tests/Hexalith.Conversations.Admin.Web.Tests/Hexalith.Conversations.Admin.Web.Tests.csproj
          --configuration Release
          --no-build
          --results-directory TestResults/admin-web
          --report-xunit-trx
          --report-xunit-trx-filename admin-web.trx

      - name: Upload Admin Web test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: admin-web-test-results
          path: TestResults/admin-web/*.trx
          retention-days: 7

  conformance:
    name: ci / conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete source history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Initialize root-declared submodules
        uses: Hexalith/Hexalith.Builds/Github/initialize-build@main

      - name: Initialize .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Build conformance project
        run: >-
          dotnet build
          tests/Hexalith.Conversations.Conformance.Tests/Hexalith.Conversations.Conformance.Tests.csproj
          --configuration Release
          -warnaserror

      - name: Run current conformance checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults/conformance
          assembly="tests/Hexalith.Conversations.Conformance.Tests/bin/Release/net10.0/Hexalith.Conversations.Conformance.Tests.dll"
          dotnet "$assembly" \
            -method- "Hexalith.Conversations.Conformance.Tests.PreservationTraceabilityManifestValidationTest.BindingsClosuresAndFrozenV1BytesShouldValidateIndependently" \
            -method- "Hexalith.Conversations.Conformance.Tests.PreservationTraceabilityManifestValidationTest.CurrentControlsAndTierPrerequisiteShouldStayTruthful" \
            -method- "Hexalith.Conversations.Conformance.Tests.SmC2BaselineReconstructionValidationTest.BaselineShouldRecordAnAuditableReconstructionMethod" \
            -parallelMode none \
            -result-trx TestResults/conformance/conformance-results.trx \
            -noLogo

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: conformance-test-results
          path: TestResults/conformance/*.trx
          retention-days: 7

  tooling:
    name: ci / release-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Initialize .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Install locked release tooling
        run: npm ci --ignore-scripts

      - name: Verify npm dependency provenance and signatures
        run: npm audit signatures

      - name: Enforce pinned commit and pull-request title policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            npx --no-install commitlint --config commitlint.config.mjs --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
            npx --no-install commitlint --config commitlint.config.mjs --verbose <<< "$PR_TITLE"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            while IFS= read -r commit; do
              git show --no-patch --format=%B "$commit" |
                npx --no-install commitlint --config commitlint.config.mjs --verbose
            done < <(git rev-list --reverse "$HEAD_SHA")
          else
            npx --no-install commitlint --config commitlint.config.mjs --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          fi

      - name: Run fail-closed tooling tests
        run: npm test
