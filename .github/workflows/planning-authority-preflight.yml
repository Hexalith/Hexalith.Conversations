name: Planning authority preflight

# Enforcement authority is an active organization ruleset selecting this exact path from
# Hexalith/Hexalith.Conversations protected main with no bypass and direct pushes blocked.
# A pull-request candidate's copy is defense in depth only and cannot attest that ruleset.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bootstrap Story 7.1 successor authority boundary
        shell: bash
        env:
          RULESET_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_WORKFLOW_REF: ${{ fromJSON(toJSON(job)).workflow_ref }}
          SOURCE_WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          SOURCE_WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          trusted_git() {
            env -i \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_SYSTEM=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1 \
              HOME=/tmp \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              git --no-replace-objects "$@"
          }
          require_exact_paths() {
            local parent="$1"
            local child="$2"
            shift 2
            local -a observed=()
            local ordinal=0
            local expected
            mapfile -d '' -t observed < <(trusted_git diff --name-only --no-renames -z "$parent" "$child" --)
            test "${#observed[@]}" -eq "$#"
            for expected in "$@"; do
              test "${observed[$ordinal]}" = "$expected"
              ((ordinal += 1))
            done
          }
          require_regular_blob() {
            local commit="$1"
            local path="$2"
            local mode kind object observed extra
            IFS=$' \t' read -r mode kind object observed extra <<< "$(trusted_git ls-tree "$commit" -- "$path")"
            test "$mode" = "100644"
            test "$kind" = "blob"
            [[ "$object" =~ ^[0-9a-f]{40}$ ]]
            test "$observed" = "$path"
            test -z "${extra:-}"
          }
          source_repository="Hexalith/Hexalith.Conversations"
          source_ref="refs/heads/main"
          source_workflow=".github/workflows/planning-authority-preflight.yml"
          source_workflow_ref="$source_repository/$source_workflow@$source_ref"
          publisher_path="_bmad/scripts/publish_story_7_1_successor_authorities.py"
          trusted_v20="6fa990459dd72d6752e12bbc806d85bf607fff85"
          trusted_v19="3045060ce48acfed60b66bacd417de4dcfd1adb0"
          trusted_entry="5fa5612dd348259ce8fc46865409f678110cec87"
          v21_path="_bmad-output/planning-artifacts/v21-story-7.1-authority-correction-v1.json"
          tooling_paths=(
            ".github/workflows/planning-authority-preflight.yml"
            "_bmad-output/implementation-artifacts/spec-publish-v20-story-7-1-release-owner-authority.md"
            "_bmad/schemas/v21-story-7.1-authority-correction-v1.schema.json"
            "_bmad/scripts/publish_story_7_1_successor_authorities.py"
            "_bmad/scripts/tests/test_publish_story_7_1_successor_authorities.py"
          )
          test "$SOURCE_WORKFLOW_REPOSITORY" = "$source_repository"
          test "$SOURCE_WORKFLOW_REF" = "$source_workflow_ref"
          [[ "$SOURCE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(trusted_git rev-parse --is-shallow-repository)" = "false"
          head="$(trusted_git rev-parse 'HEAD^{commit}')"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]]
          trusted_git cat-file -e "$trusted_v20^{commit}"
          test "$(trusted_git rev-parse "$SOURCE_WORKFLOW_SHA^{commit}")" = "$SOURCE_WORKFLOW_SHA"
          require_regular_blob "$SOURCE_WORKFLOW_SHA" "$source_workflow"
          require_regular_blob "$SOURCE_WORKFLOW_SHA" "$publisher_path"
          v21_log="$(trusted_git log --full-history --format=%H --diff-filter=A "$head" -- "$v21_path")"
          v21_publications=()
          if [[ -n "$v21_log" ]]; then
            mapfile -t v21_publications <<< "$v21_log"
          fi
          publication=""
          compare_tooling=true
          if [[ "$head" = "$trusted_v19" || "$head" = "$trusted_entry" || "$head" = "$trusted_v20" ]]; then
            test "${#v21_publications[@]}" -eq 0
            tooling="$head"
            compare_tooling=false
          elif [[ "${#v21_publications[@]}" -eq 0 ]]; then
            tooling="$head"
          elif [[ "${#v21_publications[@]}" -eq 1 ]]; then
            publication="${v21_publications[0]}"
            [[ "$publication" =~ ^[0-9a-f]{40}$ ]]
            trusted_git merge-base --is-ancestor "$publication" "$head"
            read -r publication_commit tooling extra <<< "$(trusted_git rev-list --parents -n 1 "$publication")"
            test "$publication_commit" = "$publication"
            [[ "$tooling" =~ ^[0-9a-f]{40}$ ]]
            test -z "${extra:-}"
          else
            exit 1
          fi
          if [[ "$compare_tooling" = true ]]; then
            test "$(trusted_git rev-list --parents -n 1 "$tooling")" = "$tooling $trusted_v20"
            require_exact_paths "$trusted_v20" "$tooling" "${tooling_paths[@]}"
            for path in "${tooling_paths[@]}"; do
              require_regular_blob "$SOURCE_WORKFLOW_SHA" "$path"
              require_regular_blob "$tooling" "$path"
              test "$(trusted_git ls-tree "$SOURCE_WORKFLOW_SHA" -- "$path")" = \
                "$(trusted_git ls-tree "$tooling" -- "$path")"
            done
            if [[ -n "$publication" ]]; then
              test "$(trusted_git rev-list --parents -n 1 "$publication")" = "$publication $tooling"
              require_exact_paths "$tooling" "$publication" "$v21_path"
              require_regular_blob "$publication" "$v21_path"
            fi
          fi
          successor_bootstrap="$(mktemp)"
          effective_rulesets="$(mktemp)"
          trap 'rm -f "$successor_bootstrap" "$effective_rulesets"' EXIT
          trusted_git show "$SOURCE_WORKFLOW_SHA:$publisher_path" > "$successor_bootstrap"
          env -i \
            HOME=/tmp \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            TMPDIR=/tmp \
            /usr/bin/python3 -I -B "$successor_bootstrap" --repository . bootstrap --candidate HEAD \
              --source-workflow-repository "$SOURCE_WORKFLOW_REPOSITORY" \
              --source-workflow-ref "$SOURCE_WORKFLOW_REF" \
              --source-workflow-sha "$SOURCE_WORKFLOW_SHA"
          if ! /usr/bin/curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $RULESET_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$source_repository/rulesets?includes_parents=true&per_page=100" \
            > "$effective_rulesets"
          then
            : > "$effective_rulesets"
          fi
          env -i \
            HOME=/tmp \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            TMPDIR=/tmp \
            /usr/bin/python3 -I -B "$successor_bootstrap" --repository . ci-trust \
              --rulesets-file "$effective_rulesets" \
              --source-repository-id "$SOURCE_REPOSITORY_ID" \
              --source-workflow-repository "$SOURCE_WORKFLOW_REPOSITORY" \
              --source-workflow-ref "$SOURCE_WORKFLOW_REF" \
              --source-workflow-sha "$SOURCE_WORKFLOW_SHA"

      - name: Check out pinned root submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true

      - name: Set up repository .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Install pinned uv client
        run: python3 -m pip install --disable-pip-version-check uv==0.12.13

      - name: Resolve immutable comparison range
        id: range
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$head" = "$EVENT_HEAD"
          baseline="$EVENT_BASE"
          if [[ -z "$baseline" || "$baseline" == "0000000000000000000000000000000000000000" ]]; then
            baseline="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$baseline^{commit}"
          printf 'baseline=%s\n' "$baseline" >> "$GITHUB_OUTPUT"

      - name: Set up repository Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json

      - name: Install pinned commitlint
        run: npm ci --ignore-scripts

      # Self-contained rather than delegated to the commit-message workflow: a commit that carries
      # planning authority must not be able to reach the evidence gates on an unvalidated message.
      - name: Verify commit messages before planning verification
        run: >-
          npx --no-install commitlint
          --config commitlint.config.mjs
          --from "${{ steps.range.outputs.baseline }}"
          --to HEAD
          --verbose

      - name: Synchronize frozen planning verifier environment
        run: |
          uv lock --check
          uv sync --frozen

      - name: Verify Story 7.1 successor authorities and effective hold
        shell: bash
        env:
          SOURCE_WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          set -euo pipefail
          successor_verifier="$(mktemp)"
          trap 'rm -f "$successor_verifier"' EXIT
          git --no-replace-objects show "$SOURCE_WORKFLOW_SHA:_bmad/scripts/publish_story_7_1_successor_authorities.py" > "$successor_verifier"
          if git cat-file -e HEAD:_bmad-output/planning-artifacts/v20-story-7.1-input-inventory-v1.json 2>/dev/null; then
            uv run --frozen --no-sync python3 "$successor_verifier" --repository . inventory --check
          fi
          if git cat-file -e HEAD:_bmad-output/planning-artifacts/v19-story-7.1-checkpoint-completion-authority-v1.json 2>/dev/null; then
            uv run --frozen --no-sync python3 "$successor_verifier" --repository . v19 --candidate HEAD --check
          fi
          if git cat-file -e HEAD:_bmad-output/planning-artifacts/v20-story-7.1-release-owner-authority-v1.json 2>/dev/null; then
            uv run --frozen --no-sync python3 "$successor_verifier" --repository . v20 --entry-candidate HEAD --check
          fi
          if git cat-file -e HEAD:_bmad-output/planning-artifacts/v21-story-7.1-authority-correction-v1.json 2>/dev/null; then
            uv run --frozen --no-sync python3 "$successor_verifier" --repository . v21 --candidate HEAD --check
          fi
          uv run --frozen --no-sync python3 "$successor_verifier" --repository . v21 --candidate HEAD --effective-hold --check

      # Runs before the evidence gate so a skill-tree upgrade that erased the project-owned
      # lifecycle gates is named directly, rather than surfacing as a downstream gate failure.
      - name: Verify installed lifecycle routes still carry their evidence gates
        run: >-
          uv run --frozen --no-sync python3 _bmad/scripts/check_lifecycle_gate_preflight.py
          --repository .

      # When a candidate-bound scope is in the comparison range the verifier requires exact
      # baseline-to-candidate path equality and raw mode-160000 changes remain event-owned.
      # V16 independently discovers and validates immutable V15/V16 C1/C2 transactions from Git.
      - name: Verify lifecycle evidence and candidate-bound publication scope
        run: >-
          uv run --frozen --no-sync python3 _bmad/scripts/verify_evidence_boundary.py
          --repository .
          --baseline "${{ steps.range.outputs.baseline }}"
          --candidate HEAD

      - name: Verify current applicable Python planning authority skip-free
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          uv run --frozen --no-sync python3 -m pytest -q -ra -o xfail_strict=true \
            _bmad/scripts/tests \
            --ignore=_bmad/scripts/tests/test_publish_v15_planning_tooling_environment.py \
            --ignore=_bmad/scripts/tests/test_publish_v9_planning_authority.py \
            --junitxml="$report"
          uv run --frozen --no-sync python3 -m pytest -q -ra -o xfail_strict=true \
            _bmad/scripts/tests/test_publish_v9_planning_authority.py \
            -k 'not (complete_publication_is_deterministic_and_candidate_bound or story_contract_schema_and_representative_parsing_are_exact or story_slice_is_closed_candidate_bound_and_one_way_digest_ordered or story_slice_and_checkpoint_graph_mutations_fail_closed or epic_six_retrospective_faults_fail_and_restore_byte_identically or graph_is_ordinal_and_every_successor_is_downstream_of_ir_zero or current_view_projects_exact_checkpoint_and_story_dependencies or publication_preserves_the_unrun_independent_assessment_boundary)' \
            -o junit_suite_name=current-unaffected-v9 \
            --junitxml="${report}.v9"
          python3 - "$report" "${report}.v9" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              totals = {name: sum(int(suite.get(name, "0")) for suite in suites) for name in ("tests", "failures", "errors", "skipped")}
              if totals["tests"] == 0 or any(totals[name] for name in ("failures", "errors", "skipped")):
                  raise SystemExit(f"non-passing pytest result in {path}: {totals}")
          PY

      - name: Verify complete predecessor Python suites and V9 authority skip-free
        shell: bash
        run: |
          set -euo pipefail
          historical="$(mktemp -d)"
          git clone --shared --no-checkout . "$historical"
          git -C "$historical" checkout --detach 6400c09d0ab8352d2ed9dd0221ffe6f4f96b91c4
          while read -r key path; do
            name="${key#submodule.}"
            name="${name%.path}"
            git -C "$historical" config "submodule.$name.url" "$GITHUB_WORKSPACE/$path"
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$')
          git -c protocol.file.allow=always -C "$historical" submodule update --init --checkout
          uv sync --project "$historical" --frozen
          report="$(mktemp)"
          uv run --project "$historical" --frozen --no-sync python3 -m pytest -q -ra -o xfail_strict=true \
            "$historical/_bmad/scripts/tests" \
            --junitxml="$report"
          git -C "$historical" checkout --detach 08a4bdcc5a18067f8f93c777055d8097987a9da2
          uv sync --project "$historical" --frozen
          v15_report="$(mktemp)"
          uv run --project "$historical" --frozen --no-sync python3 -m pytest -q -ra -o xfail_strict=true \
            "$historical/_bmad/scripts/tests/test_publish_v15_planning_tooling_environment.py" \
            --junitxml="$v15_report"
          python3 - "$report" "$v15_report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              totals = {name: sum(int(suite.get(name, "0")) for suite in suites) for name in ("tests", "failures", "errors", "skipped")}
              if totals["tests"] == 0 or any(totals[name] for name in ("failures", "errors", "skipped")):
                  raise SystemExit(f"non-passing historical pytest result in {path}: {totals}")
          PY
          git -C "$historical" checkout --detach 6400c09d0ab8352d2ed9dd0221ffe6f4f96b91c4
          uv sync --project "$historical" --frozen
          uv run --project "$historical" --frozen --no-sync python3 \
            "$historical/_bmad/scripts/publish_v9_planning_authority.py" \
            --repository "$historical" \
            --check

      # Consume the evidence and the independent decision, not just the authority shape. Without
      # this step a V13 authority-shape check reports green while the decision it rests on may be
      # absent, stale, or overreaching (E6-REMEDIATION A3 §4.5).
      - name: Verify current-proof decision chain and candidate authorities
        run: |
          uv run --frozen --no-sync python3 _bmad/scripts/verify_decision_chain.py --repository .
          uv run --frozen --no-sync python3 _bmad/scripts/publish_v13_current_proof_authority.py --repository . --check
          uv run --frozen --no-sync python3 _bmad/scripts/publish_v14_current_candidate_authority.py --repository . --check
          uv run --frozen --no-sync python3 _bmad/scripts/publish_v15_planning_tooling_environment.py --repository . --candidate HEAD --check --check-installed
          uv run --frozen --no-sync python3 _bmad/scripts/publish_v16_planning_tooling_lifecycle.py --repository . --candidate HEAD --check --check-installed
          uv run --frozen --no-sync python3 _bmad/scripts/publish_v18_package_environment_authority.py --repository . --candidate HEAD --check

      - name: Build conformance verifier
        run: dotnet build tests/Hexalith.Conversations.Conformance.Tests/Hexalith.Conversations.Conformance.Tests.csproj --configuration Release -m:1

      - name: Run direct planning authority validators
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the V9 guard identity while invoking the same classes through xUnit v3 directly:
          # FullyQualifiedName~ArchitecturePlanningAuthorityValidationTest|FullyQualifiedName~PlanningAuthorityV9ValidationTest|FullyQualifiedName~PlanningAuthorityV8ValidationTest
          assembly="tests/Hexalith.Conversations.Conformance.Tests/bin/Release/net10.0/Hexalith.Conversations.Conformance.Tests.dll"
          for class in \
            Hexalith.Conversations.Conformance.Tests.ArchitecturePlanningAuthorityValidationTest \
            Hexalith.Conversations.Conformance.Tests.PlanningAuthorityV8ValidationTest \
            Hexalith.Conversations.Conformance.Tests.PlanningAuthorityV9ValidationTest \
            Hexalith.Conversations.Conformance.Tests.PlanningToolingEnvironmentAuthorityV15ValidationTest \
            Hexalith.Conversations.Conformance.Tests.PlanningToolingLifecycleAuthorityV16ValidationTest \
            Hexalith.Conversations.Conformance.Tests.PackageEnvironmentAuthorityV18ValidationTest
          do
            dotnet "$assembly" -class "$class"
          done
