name: Planning authority preflight

# pull_request_target runs only the protected, base-owned trust job. The unprivileged
# pull_request event runs candidate tests separately, with read-only permissions and no secrets.
# Push/manual runs require the protected verdict before candidate validation.

on:
  pull_request_target:
    branches: [main]
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-planning-authority:
    name: protected-planning-authority-${{ github.event_name }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      baseline: ${{ steps.range.outputs.baseline }}
      candidate: ${{ steps.range.outputs.candidate }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true

      - name: Set up exact protected Python
        id: protected-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"
          check-latest: false
          update-environment: false

      - name: Install pinned uv client
        id: protected-uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.13"
          checksum: "745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd"
          enable-cache: false
          working-directory: ${{ runner.temp }}

      - name: Resolve immutable comparison range
        id: range
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          TRUSTED_EVENT_NAME: ${{ github.event_name }}
          TRUSTED_EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TRUSTED_EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONSAFEPATH: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          trusted_git() {
            env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/planning-authority-trusted-home" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_OPTIONAL_LOCKS=0 \
              /usr/bin/git -C "$GITHUB_WORKSPACE" \
              -c core.hooksPath=/dev/null -c protocol.file.allow=never "$@"
          }
          install -d -m 0700 "$RUNNER_TEMP/planning-authority-trusted-home"
          head="$(trusted_git rev-parse HEAD)"
          test "$head" = "$TRUSTED_EVENT_HEAD"
          baseline="$TRUSTED_EVENT_BASE"
          if [[ -z "$baseline" || "$baseline" == "0000000000000000000000000000000000000000" ]]; then
            baseline="$(trusted_git rev-parse HEAD^)"
          fi
          trusted_git cat-file -e "$baseline^{commit}"
          printf 'baseline=%s\n' "$baseline" >> "$GITHUB_OUTPUT"
          printf 'candidate=%s\n' "$TRUSTED_EVENT_HEAD" >> "$GITHUB_OUTPUT"
          # V27 provenance is the event-supplied base of a trigger that is itself branch-filtered to
          # the protected branch. push and pull_request_target are both `branches: [main]`;
          # workflow_dispatch carries no branch filter and supplies no base. An anchor is therefore
          # never synthesized from HEAD^, from the checked-out head, or from an all-zero base: when
          # the event supplies none, this output is empty, V27 does not select, and the existing V24
          # route stays authoritative.
          trusted_host_commit=""
          case "$TRUSTED_EVENT_NAME" in
            push|pull_request_target)
              if [[ -n "$TRUSTED_EVENT_BASE" && "$TRUSTED_EVENT_BASE" != "0000000000000000000000000000000000000000" ]]; then
                trusted_git cat-file -e "$TRUSTED_EVENT_BASE^{commit}"
                trusted_host_commit="$TRUSTED_EVENT_BASE"
              fi
              ;;
          esac
          printf 'trusted_host_commit=%s\n' "$trusted_host_commit" >> "$GITHUB_OUTPUT"

      - name: Materialize protected planning-authority trust hosts
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          # Host bytes come from the comparison-range baseline, which is the protected event base
          # when the event supplies one and falls back to HEAD^ when it does not. That fallback is
          # good enough to choose host bytes but is never a trust anchor, so the V27 anchor is a
          # separate, stricter value that stays empty unless a main-filtered event supplied a base.
          PROTECTED_HOST_COMMIT: ${{ steps.range.outputs.baseline }}
          PYTHONSAFEPATH: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          trusted_git() {
            env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/planning-authority-trusted-home" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_OPTIONAL_LOCKS=0 \
              /usr/bin/git -C "$GITHUB_WORKSPACE" \
              -c core.hooksPath=/dev/null -c protocol.file.allow=never "$@"
          }
          host_dir="$RUNNER_TEMP/planning-authority-protected-host"
          install -d -m 0700 "$host_dir"
          for path in \
            _bmad/scripts/resolve_current_planning_authority.py \
            _bmad/scripts/verify_evidence_boundary.py \
            pyproject.toml \
            uv.lock
          do
            name="${path##*/}"
            trusted_git cat-file -e "$PROTECTED_HOST_COMMIT:$path"
            trusted_git show "$PROTECTED_HOST_COMMIT:$path" > "$host_dir/$name"
          done
          chmod 0500 "$host_dir/resolve_current_planning_authority.py" "$host_dir/verify_evidence_boundary.py"
          chmod 0400 "$host_dir/pyproject.toml" "$host_dir/uv.lock"
          printf 'resolver=%s\n' "$(sha256sum "$host_dir/resolve_current_planning_authority.py" | cut -d' ' -f1)"
          printf 'verifier=%s\n' "$(sha256sum "$host_dir/verify_evidence_boundary.py" | cut -d' ' -f1)"
          # The V27 result schema comes from the protected host, never from the candidate, and is
          # optional: a host that predates the externally authorized V27 bootstrap keeps the legacy
          # V22/V23/V24 branches and validates no V27 envelope.
          v27_schema="_bmad/schemas/v27-story-7.1-lifecycle-evidence-authority-v1.schema.json"
          v27_schema_sha256="d8f6920c00821cab1f0d1e434ad6c8faf965e9bd9f60f5655e7c734683700399"
          if trusted_git cat-file -e "$PROTECTED_HOST_COMMIT:$v27_schema"; then
            trusted_git show "$PROTECTED_HOST_COMMIT:$v27_schema" > "$host_dir/${v27_schema##*/}"
            observed_v27_schema="$(sha256sum "$host_dir/${v27_schema##*/}" | cut -d' ' -f1)"
            test "$observed_v27_schema" = "$v27_schema_sha256"
            chmod 0400 "$host_dir/${v27_schema##*/}"
            printf 'v27-result-schema=%s\n' "$observed_v27_schema"
          else
            printf 'v27-result-schema=absent\n'
          fi
          v28_schema="_bmad/schemas/v28-five-root-gitlink-authority-v1.schema.json"
          v28_schema_sha256="d3efd5fbddeb062d39a21e952ddc36cbbd57648e9068dde216863766a7e49245"
          if trusted_git cat-file -e "$PROTECTED_HOST_COMMIT:$v28_schema"; then
            trusted_git show "$PROTECTED_HOST_COMMIT:$v28_schema" > "$host_dir/${v28_schema##*/}"
            observed_v28_schema="$(sha256sum "$host_dir/${v28_schema##*/}" | cut -d' ' -f1)"
            test "$observed_v28_schema" = "$v28_schema_sha256"
            chmod 0400 "$host_dir/${v28_schema##*/}"
            printf 'v28-result-schema=%s\n' "$observed_v28_schema"
          else
            printf 'v28-result-schema=absent\n'
          fi

      - name: Synchronize protected planning verifier environment
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PROTECTED_BASE_PYTHON: ${{ steps.protected-python.outputs.python-path }}
          PROTECTED_UV: ${{ steps.protected-uv.outputs.uv-path }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/planning-authority-protected-home"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/planning-authority-protected-home" \
            TMPDIR="$RUNNER_TEMP" UV_NO_CONFIG=1 UV_PYTHON="$PROTECTED_BASE_PYTHON" \
            UV_PYTHON_DOWNLOADS=never "$PROTECTED_UV" sync \
            --project "$RUNNER_TEMP/planning-authority-protected-host" --frozen \
            --python "$PROTECTED_BASE_PYTHON"

      - name: Verify synchronized protected Python identity
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PYTHONSAFEPATH: "1"
          PYTHONNOUSERSITE: "1"
          PROTECTED_BASE_PYTHON: ${{ steps.protected-python.outputs.python-path }}
        run: |
          set -euo pipefail
          protected_python="$RUNNER_TEMP/planning-authority-protected-host/.venv/bin/python"
          test -x "$protected_python"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/planning-authority-protected-home" \
            TMPDIR="$RUNNER_TEMP" PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 \
            "$protected_python" -I -P - "$PROTECTED_BASE_PYTHON" <<'PY'
          import pathlib
          import sys
          import jsonschema
          expected_base = pathlib.Path(sys.argv[1]).resolve(strict=True)
          observed_base = pathlib.Path(sys._base_executable).resolve(strict=True)
          if observed_base != expected_base:
              raise SystemExit(f"protected venv base mismatch: expected={expected_base}; observed={observed_base}")
          if sys.prefix == sys.base_prefix or sys.version_info[:3] != (3, 11, 15):
              raise SystemExit(f"protected venv identity mismatch: prefix={sys.prefix}; base={sys.base_prefix}; version={sys.version}")
          if not pathlib.Path(jsonschema.__file__).resolve(strict=True).is_relative_to(pathlib.Path(sys.prefix).resolve(strict=True)):
              raise SystemExit("jsonschema was not imported from the synchronized protected venv")
          PY

      - name: Resolve current planning authority through the protected host
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          TRUSTED_HOST_COMMIT: ${{ steps.range.outputs.trusted_host_commit }}
          PYTHONSAFEPATH: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/current-planning-authority-result.json"
          protected_python="$RUNNER_TEMP/planning-authority-protected-host/.venv/bin/python"
          v27_schema="$RUNNER_TEMP/planning-authority-protected-host/v27-story-7.1-lifecycle-evidence-authority-v1.schema.json"
          v28_schema="$RUNNER_TEMP/planning-authority-protected-host/v28-five-root-gitlink-authority-v1.schema.json"
          host_script="$RUNNER_TEMP/planning-authority-protected-host/resolve_current_planning_authority.py"
          # The flag is offered only to a host that actually accepts it. The probe asks the host
          # itself: argparse lists exactly the arguments it registered, so a comment, docstring or
          # help string cannot satisfy it and a predecessor host fails the probe, not the run.
          supports_trusted_host() {
            local host="$1"
            local usage="$RUNNER_TEMP/$(basename "$host").usage.txt"
            set +e
            env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/planning-authority-protected-home" \
              TMPDIR="$RUNNER_TEMP" PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 \
              "$protected_python" -I -P "$host" --help > "$usage" 2>&1
            local probe_exit="$?"
            set -e
            test "$probe_exit" -eq 0 && grep -q -e '--trusted-host' "$usage"
          }
          trusted_args=()
          if [[ -n "$TRUSTED_HOST_COMMIT" ]] && supports_trusted_host "$host_script"; then
            trusted_args=(--trusted-host "$TRUSTED_HOST_COMMIT")
          fi
          set +e
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/planning-authority-protected-home" \
            TMPDIR="$RUNNER_TEMP" PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 \
            "$protected_python" -I -P \
            "$RUNNER_TEMP/planning-authority-protected-host/resolve_current_planning_authority.py" \
            --repository "$GITHUB_WORKSPACE" --candidate "${{ steps.range.outputs.candidate }}" \
            "${trusted_args[@]+"${trusted_args[@]}"}" --check > "$result"
          resolver_exit="$?"
          set -e
          if [[ ! -s "$result" ]]; then
            echo "protected current-authority host produced no result document" >&2
            exit 2
          fi
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/planning-authority-protected-home" \
            TMPDIR="$RUNNER_TEMP" PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 \
            "$protected_python" -I -P - "$result" "$resolver_exit" "$v27_schema" "$v28_schema" <<'PY'
          import json
          import pathlib
          import sys
          document = json.load(open(sys.argv[1], encoding="utf-8"))
          observed_exit = int(sys.argv[2])
          v27_schema_path = pathlib.Path(sys.argv[3])
          v28_schema_path = pathlib.Path(sys.argv[4])
          expected_exit = {"PASS": 0, "FAIL": 1, "BLOCKED": 2}
          result = document.get("result")
          common_keys = {
              "schemaVersion", "result", "exitCode", "effectiveHold", "implementationHold",
              "observed", "assertionLedger", "blockers", "ownerApprovalClaimed",
              "releaseAuthorized", "pushAuthorized", "executionAllowed",
          }
          keys = set(document)
          if keys not in (common_keys, common_keys | {"storyExecution"}):
              raise SystemExit("protected current-authority host returned an incomplete result envelope")
          if (
              document.get("schemaVersion") != "hexalith.conversations.current-planning-authority-result.v1"
              or result not in expected_exit
              or document.get("exitCode") != expected_exit[result]
              or observed_exit != expected_exit[result]
              or not isinstance(document.get("observed"), dict)
              or not isinstance(document.get("assertionLedger"), list)
              or not document["assertionLedger"]
              or not isinstance(document.get("blockers"), list)
              or document.get("releaseAuthorized") is not False
              or document.get("pushAuthorized") is not False
          ):
              raise SystemExit("protected current-authority host returned contradictory result semantics")
          if result != "PASS" and (
              document.get("effectiveHold") != "ACTIVE"
              or document.get("implementationHold") != "ACTIVE"
              or document.get("ownerApprovalClaimed") is not False
              or document.get("executionAllowed") is not False
              or not document["blockers"]
          ):
              raise SystemExit("nonpassing current-authority result enabled execution")
          if "storyExecution" in document and document["storyExecution"] != {
              "7.1": result == "PASS", "7.2": False, "7.3": False, "7.4": False,
          }:
              raise SystemExit("protected current-authority host returned contradictory story execution")
          if result == "PASS" and "storyExecution" not in document and (
              document.get("effectiveHold") != "ACTIVE"
              or document.get("implementationHold") != "ACTIVE"
              or document.get("ownerApprovalClaimed") is not False
              or document.get("executionAllowed") is not False
              or document["blockers"]
          ):
              raise SystemExit("protected V22 result violated its non-executable PASS contract")
          if result == "PASS" and "storyExecution" in document and (
              document.get("effectiveHold") != "EXECUTION_ALLOWED"
              or document.get("implementationHold") != "EXECUTION_ALLOWED"
              or document.get("ownerApprovalClaimed") is not True
              or document.get("executionAllowed") is not True
              or document["blockers"]
          ):
              raise SystemExit("protected successor result violated its executable PASS contract")
          # V27 owns a closed route-discriminated envelope. The discriminator and the schema both
          # come from the protected host, so a candidate cannot declare or relax its own route.
          first = document["assertionLedger"][0]
          route = first.get("id", "") if isinstance(first, dict) else ""
          if isinstance(route, str) and (route.startswith("V28.") or route.startswith("V28_")):
              if not v28_schema_path.is_file():
                  raise SystemExit("protected host returned a V28 route without the protected V28 schema")
              import jsonschema
              v28_schema = json.loads(v28_schema_path.read_text(encoding="utf-8"))
              jsonschema.Draft202012Validator.check_schema(v28_schema)
              jsonschema.Draft202012Validator(v28_schema).validate(document)
              if "storyExecution" in document or document.get("effectiveHold") != "ACTIVE":
                  raise SystemExit("protected V28 result claimed story execution")
              if result == "PASS" and (
                  document.get("executionAllowed") is not False
                  or document.get("ownerApprovalClaimed") is not False
                  or document["blockers"]
                  or any(row.get("state") != "PASS" for row in document["assertionLedger"])
              ):
                  raise SystemExit("protected V28 result violated its non-executable PASS contract")
              if result != "PASS" and not document["blockers"]:
                  raise SystemExit("nonpassing protected V28 result carried no blocker")
          # Both discriminator forms are V27: a routed envelope names V27.ROUTE.*, while a
          # resolver-boundary failure names its V27_ blocker code as the first ledger id.
          if isinstance(route, str) and (route.startswith("V27.") or route.startswith("V27_")):
              if not v27_schema_path.is_file():
                  raise SystemExit("protected host returned a V27 route without the protected V27 schema")
              import jsonschema
              v27_schema = json.loads(v27_schema_path.read_text(encoding="utf-8"))
              jsonschema.Draft202012Validator.check_schema(v27_schema)
              jsonschema.Draft202012Validator(v27_schema).validate(document)
              if "storyExecution" in document or document.get("effectiveHold") != "ACTIVE":
                  raise SystemExit("protected V27 result claimed story execution")
              if result == "PASS" and (
                  document.get("executionAllowed") is not False
                  or document.get("ownerApprovalClaimed") is not False
                  or document["blockers"]
                  or any(row.get("state") != "PASS" for row in document["assertionLedger"])
              ):
                  raise SystemExit("protected V27 result violated its non-executable PASS contract")
              if result != "PASS" and not document["blockers"]:
                  raise SystemExit("nonpassing protected V27 result carried no blocker")
          raise SystemExit(observed_exit)
          PY

      # When a candidate-bound scope is in the comparison range the verifier requires exact
      # baseline-to-candidate path equality and raw mode-160000 changes remain event-owned.
      # V16 independently discovers and validates immutable V15/V16 C1/C2 transactions from Git.
      - name: Verify lifecycle evidence and candidate-bound publication scope
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          TRUSTED_HOST_COMMIT: ${{ steps.range.outputs.trusted_host_commit }}
          PYTHONSAFEPATH: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence-boundary-result.json"
          protected_python="$RUNNER_TEMP/planning-authority-protected-host/.venv/bin/python"
          host_script="$RUNNER_TEMP/planning-authority-protected-host/verify_evidence_boundary.py"
          # The flag is offered only to a host that actually accepts it. The probe asks the host
          # itself: argparse lists exactly the arguments it registered, so a comment, docstring or
          # help string cannot satisfy it and a predecessor host fails the probe, not the run.
          supports_trusted_host() {
            local host="$1"
            local usage="$RUNNER_TEMP/$(basename "$host").usage.txt"
            set +e
            env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/planning-authority-protected-home" \
              TMPDIR="$RUNNER_TEMP" PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 \
              "$protected_python" -I -P "$host" --help > "$usage" 2>&1
            local probe_exit="$?"
            set -e
            test "$probe_exit" -eq 0 && grep -q -e '--trusted-host' "$usage"
          }
          trusted_args=()
          if [[ -n "$TRUSTED_HOST_COMMIT" ]] && supports_trusted_host "$host_script"; then
            trusted_args=(--trusted-host "$TRUSTED_HOST_COMMIT")
          fi
          set +e
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/planning-authority-protected-home" \
            TMPDIR="$RUNNER_TEMP" PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 \
            "$protected_python" -I -P "$host_script" \
            --repository "$GITHUB_WORKSPACE" --baseline "${{ steps.range.outputs.baseline }}" \
            --candidate "${{ steps.range.outputs.candidate }}" \
            "${trusted_args[@]+"${trusted_args[@]}"}" --output "$evidence" > /dev/null
          evidence_exit="$?"
          set -e
          if [[ ! -s "$evidence" ]]; then
            echo "protected evidence host produced no result document" >&2
            exit 2
          fi
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/planning-authority-protected-home" \
            TMPDIR="$RUNNER_TEMP" PYTHONSAFEPATH=1 PYTHONNOUSERSITE=1 \
            "$protected_python" -I -P - "$evidence" "$evidence_exit" <<'PY'
          import json
          import sys
          document = json.load(open(sys.argv[1], encoding="utf-8"))
          observed_exit = int(sys.argv[2])
          expected_exit = {"PASS": 0, "not-applicable": 0, "FAIL": 1, "BLOCKED": 2}
          result = document.get("result")
          if (
              document.get("schemaVersion") != "hexalith.conversations.evidence-boundary-result.v1"
              or result not in expected_exit
              or observed_exit != expected_exit[result]
              or not isinstance(document.get("assertionLedger"), list)
              or not document["assertionLedger"]
              or not isinstance(document.get("blockers"), list)
          ):
              raise SystemExit("protected evidence host returned contradictory result semantics")
          # The evidence host states its own non-executable contract; it is never inferred from an
          # exit status, and it is never allowed to disagree with the current-authority host.
          if (
              document.get("effectiveHold") != "ACTIVE"
              or document.get("implementationHold") != "ACTIVE"
              or document.get("ownerApprovalClaimed") is not False
              or document.get("releaseAuthorized") is not False
              or document.get("pushAuthorized") is not False
              or document.get("executionAllowed") is not False
          ):
              raise SystemExit("protected evidence host returned an executable or unheld result")
          if result != "PASS" and result != "not-applicable" and not document["blockers"]:
              raise SystemExit("nonpassing protected evidence result carried no blocker")
          raise SystemExit(observed_exit)
          PY

  candidate-validation:
    name: candidate-validation-${{ github.event_name }}
    needs: protected-planning-authority
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.protected-planning-authority.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate with pinned root submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || needs.protected-planning-authority.outputs.candidate || github.sha }}
          submodules: true

      - name: Verify checked-out candidate identity
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          TRUSTED_EVENT_HEAD: ${{ github.event.pull_request.head.sha || needs.protected-planning-authority.outputs.candidate || github.sha }}
        run: |
          set -euo pipefail
          observed="$(env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/planning-authority-candidate-home" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_OPTIONAL_LOCKS=0 \
            /usr/bin/git -C "$GITHUB_WORKSPACE" --no-replace-objects \
            -c core.hooksPath=/dev/null -c protocol.file.allow=never rev-parse HEAD)"
          test "$observed" = "$TRUSTED_EVENT_HEAD"

      - name: Set up repository .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Install pinned uv client
        run: python3 -m pip install --disable-pip-version-check uv==0.12.13

      - name: Set up repository Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json

      - name: Install pinned commitlint
        run: npm ci --ignore-scripts

      # Self-contained rather than delegated to the commit-message workflow: a commit that carries
      # planning authority must not be able to reach the evidence gates on an unvalidated message.
      - name: Verify commit messages before planning verification
        run: >-
          npx --no-install commitlint
          --config commitlint.config.mjs
          --from "${{ github.event.pull_request.base.sha || needs.protected-planning-authority.outputs.baseline }}"
          --to "${{ github.event.pull_request.head.sha || needs.protected-planning-authority.outputs.candidate || github.sha }}"
          --verbose

      - name: Synchronize frozen candidate environment
        run: |
          uv lock --check
          uv sync --frozen

      # Runs before candidate suites so a skill-tree upgrade that erased the project-owned
      # lifecycle gates is named directly, rather than surfacing as a downstream test failure.
      - name: Verify installed lifecycle routes still carry their evidence gates
        run: >-
          uv run --frozen --no-sync python3 _bmad/scripts/check_lifecycle_gate_preflight.py
          --repository .

      - name: Verify current applicable Python planning authority skip-free
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          uv run --frozen --no-sync python3 -m pytest -q -ra -o xfail_strict=true \
            _bmad/scripts/tests \
            --ignore=_bmad/scripts/tests/test_publish_v15_planning_tooling_environment.py \
            --ignore=_bmad/scripts/tests/test_publish_story_7_1_successor_authorities.py \
            --ignore=_bmad/scripts/tests/test_publish_v9_planning_authority.py \
            --junitxml="$report"
          uv run --frozen --no-sync python3 -m pytest -q -ra -o xfail_strict=true \
            _bmad/scripts/tests/test_publish_v9_planning_authority.py \
            -k 'not (complete_publication_is_deterministic_and_candidate_bound or story_contract_schema_and_representative_parsing_are_exact or story_slice_is_closed_candidate_bound_and_one_way_digest_ordered or story_slice_and_checkpoint_graph_mutations_fail_closed or epic_six_retrospective_faults_fail_and_restore_byte_identically or graph_is_ordinal_and_every_successor_is_downstream_of_ir_zero or current_view_projects_exact_checkpoint_and_story_dependencies or publication_preserves_the_unrun_independent_assessment_boundary)' \
            -o junit_suite_name=current-unaffected-v9 \
            --junitxml="${report}.v9"
          python3 - "$report" "${report}.v9" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              totals = {name: sum(int(suite.get(name, "0")) for suite in suites) for name in ("tests", "failures", "errors", "skipped")}
              if totals["tests"] == 0 or any(totals[name] for name in ("failures", "errors", "skipped")):
                  raise SystemExit(f"non-passing pytest result in {path}: {totals}")
          PY

      - name: Verify complete predecessor Python suites and V9 authority skip-free
        shell: bash
        run: |
          set -euo pipefail
          historical="$(mktemp -d)"
          git clone --shared --no-checkout . "$historical"
          git -C "$historical" checkout --detach 6400c09d0ab8352d2ed9dd0221ffe6f4f96b91c4
          while read -r key path; do
            name="${key#submodule.}"
            name="${name%.path}"
            git -C "$historical" config "submodule.$name.url" "$GITHUB_WORKSPACE/$path"
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$')
          git -c protocol.file.allow=always -C "$historical" submodule update --init --checkout
          uv sync --project "$historical" --frozen
          report="$(mktemp)"
          uv run --project "$historical" --frozen --no-sync python3 -m pytest -q -ra -o xfail_strict=true \
            "$historical/_bmad/scripts/tests" \
            --junitxml="$report"
          git -C "$historical" checkout --detach 08a4bdcc5a18067f8f93c777055d8097987a9da2
          uv sync --project "$historical" --frozen
          v15_report="$(mktemp)"
          uv run --project "$historical" --frozen --no-sync python3 -m pytest -q -ra -o xfail_strict=true \
            "$historical/_bmad/scripts/tests/test_publish_v15_planning_tooling_environment.py" \
            --junitxml="$v15_report"
          git -C "$historical" checkout --detach 239758d396d28372687b73f5dc128405892cb520
          uv sync --project "$historical" --frozen
          v21_report="$(mktemp)"
          uv run --project "$historical" --frozen --no-sync python3 -m pytest -q -ra -o xfail_strict=true \
            "$historical/_bmad/scripts/tests/test_publish_story_7_1_successor_authorities.py" \
            --junitxml="$v21_report"
          python3 - "$report" "$v15_report" "$v21_report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              totals = {name: sum(int(suite.get(name, "0")) for suite in suites) for name in ("tests", "failures", "errors", "skipped")}
              if totals["tests"] == 0 or any(totals[name] for name in ("failures", "errors", "skipped")):
                  raise SystemExit(f"non-passing historical pytest result in {path}: {totals}")
          PY
          git -C "$historical" checkout --detach 6400c09d0ab8352d2ed9dd0221ffe6f4f96b91c4
          uv sync --project "$historical" --frozen
          uv run --project "$historical" --frozen --no-sync python3 \
            "$historical/_bmad/scripts/publish_v9_planning_authority.py" \
            --repository "$historical" \
            --check

      # Consume the evidence and the independent decision, not just the authority shape. Without
      # this step a V13 authority-shape check reports green while the decision it rests on may be
      # absent, stale, or overreaching (E6-REMEDIATION A3 §4.5).
      - name: Verify current-proof decision chain and candidate authorities
        run: |
          uv run --frozen --no-sync python3 _bmad/scripts/verify_decision_chain.py --repository .
          uv run --frozen --no-sync python3 _bmad/scripts/publish_v13_current_proof_authority.py --repository . --check
          uv run --frozen --no-sync python3 _bmad/scripts/publish_v14_current_candidate_authority.py --repository . --check
          uv run --frozen --no-sync python3 _bmad/scripts/publish_v15_planning_tooling_environment.py --repository . --candidate HEAD --check --check-installed
          uv run --frozen --no-sync python3 _bmad/scripts/publish_v16_planning_tooling_lifecycle.py --repository . --candidate HEAD --check --check-installed
          uv run --frozen --no-sync python3 _bmad/scripts/publish_v18_package_environment_authority.py --repository . --candidate HEAD --check

      - name: Build conformance verifier
        run: dotnet build tests/Hexalith.Conversations.Conformance.Tests/Hexalith.Conversations.Conformance.Tests.csproj --configuration Release -m:1

      - name: Run direct planning authority validators
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the V9 guard identity while invoking the same classes through xUnit v3 directly:
          # FullyQualifiedName~ArchitecturePlanningAuthorityValidationTest|FullyQualifiedName~PlanningAuthorityV9ValidationTest|FullyQualifiedName~PlanningAuthorityV8ValidationTest
          assembly="tests/Hexalith.Conversations.Conformance.Tests/bin/Release/net10.0/Hexalith.Conversations.Conformance.Tests.dll"
          for class in \
            Hexalith.Conversations.Conformance.Tests.ArchitecturePlanningAuthorityValidationTest \
            Hexalith.Conversations.Conformance.Tests.PlanningAuthorityV8ValidationTest \
            Hexalith.Conversations.Conformance.Tests.PlanningAuthorityV9ValidationTest \
            Hexalith.Conversations.Conformance.Tests.PlanningToolingEnvironmentAuthorityV15ValidationTest \
            Hexalith.Conversations.Conformance.Tests.PlanningToolingLifecycleAuthorityV16ValidationTest \
            Hexalith.Conversations.Conformance.Tests.PackageEnvironmentAuthorityV18ValidationTest
          do
            dotnet "$assembly" -class "$class"
          done
