[project]
name = "hexalith-conversations-planning"
version = "0.0.0"
description = "Pinned planning-authority verification environment for Hexalith.Conversations"
requires-python = ">=3.11"
dependencies = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["_bmad/scripts/tests"]
